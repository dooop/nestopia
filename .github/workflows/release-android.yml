name: Release Android AAR (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Maven version to publish (for example 0.1.0)"
        required: true
        type: string

jobs:
  publish:
    uses: ./.github/workflows/release-android-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ inputs.version }}
