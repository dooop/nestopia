name: Publish Android AAR to Maven

on:
  workflow_call:
    inputs:
      version:
        description: "Maven version to publish"
        required: true
        type: string

concurrency:
  group: release-android-publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NDK_VERSION: "29.0.14206865"
  NESTOPIA_ABIS: "arm64-v8a,x86_64"

jobs:
  publish:
    name: Verify and publish Maven package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid Maven version: $VERSION"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release AAR
        run: |
          ./gradlew --no-daemon :nestopia:assembleRelease \
            -Pnestopia.abis="${NESTOPIA_ABIS}" \
            -Pnestopia.version="${{ inputs.version }}"
      - name: Build sample from release AAR
        run: |
          ./gradlew --no-daemon :app:assembleLocalRelease \
            -Pnestopia.releaseAar="${GITHUB_WORKSPACE}/android/nestopia/build/outputs/aar/nestopia-release.aar" \
            -Pnestopia.abis="${NESTOPIA_ABIS}"
      - name: Verify release artifacts
        run: |
          scripts/verify-release-artifacts.sh \
            android/nestopia/build/outputs/aar/nestopia-release.aar \
            android/app/build/outputs/apk/local/release/nestopia-local-release-unsigned.apk \
            "${NESTOPIA_ABIS}"
      - name: Bundle complete corresponding source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          SOURCE_ARCHIVE="${GITHUB_WORKSPACE}/android/nestopia/build/distributions/nestopia-${VERSION}-complete-source.tar.gz"
          scripts/package-source-archive.sh "$SOURCE_ARCHIVE" "nestopia-${VERSION}-source"
          echo "NESTOPIA_COMPLETE_SOURCE_ARCHIVE=${SOURCE_ARCHIVE}" >> "$GITHUB_ENV"
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --no-daemon :nestopia:publishReleasePublicationToGitHubPackagesRepository \
            -Pnestopia.abis="${NESTOPIA_ABIS}" \
            -Pnestopia.version="${{ inputs.version }}" \
            -Pnestopia.completeSourceArchive="${NESTOPIA_COMPLETE_SOURCE_ARCHIVE}" \
            -Pnestopia.githubRepository="${GITHUB_REPOSITORY}"
      - name: Write provenance
        run: |
          {
            echo "coordinates=io.github.dooop:nestopia:${{ inputs.version }}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "wrapper_commit=${GITHUB_SHA}"
            echo "upstream_commit=$(git -C nestopia rev-parse HEAD)"
            echo "abis=${NESTOPIA_ABIS}"
            echo "ndk=${NDK_VERSION}"
          } > android-release-provenance.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nestopia-android-${{ inputs.version }}
          path: |
            android/nestopia/build/outputs/aar/nestopia-release.aar
            android/nestopia/build/publications/release/pom-default.xml
            android/nestopia/build/intermediates/source_jar/release/release-sources.jar
            android/nestopia/build/distributions/nestopia-${{ inputs.version }}-complete-source.tar.gz
            android/app/build/outputs/apk/local/release/nestopia-local-release-unsigned.apk
            android-release-provenance.txt
          if-no-files-found: error
