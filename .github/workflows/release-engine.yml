name: Release engine XCFramework

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example 0.1.0)"
        required: true
      bump_manifest:
        description: "Open a PR bumping Package.swift"
        type: boolean
        default: true

concurrency:
  group: release-engine-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: "16.4"

jobs:
  build-slice:
    name: Build ${{ matrix.slice }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slice:
          - ios-arm64
          - ios-arm64_x86_64-simulator
          - tvos-arm64
          - tvos-arm64_x86_64-simulator
          - macos-arm64_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Build slice
        run: scripts/build-engine-slice.sh "${{ matrix.slice }}" "slices/${{ matrix.slice }}"
      - name: Pack slice
        run: tar -cf "slice-${{ matrix.slice }}.tar" -C slices "${{ matrix.slice }}"
      - uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.slice }}
          path: slice-${{ matrix.slice }}.tar
          retention-days: 5

  publish:
    name: Publish XCFramework draft
    needs: build-slice
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - uses: actions/download-artifact@v8
        with:
          pattern: slice-*
          path: downloads
          merge-multiple: true
      - name: Assemble XCFramework
        run: |
          mkdir -p slices
          for tarball in downloads/*.tar; do tar -xf "$tarball" -C slices; done
          scripts/make-engine-xcframework.sh slices dist
      - name: Validate local binary artifact
        env:
          NESTOPIA_ENGINE_ARTIFACTS_DIR: dist
        run: |
          swift package reset
          for entry in \
            "macOS|macos" \
            "iOS|ios" \
            "iOS Simulator|ios-simulator" \
            "tvOS|tvos" \
            "tvOS Simulator|tvos-simulator"; do
            platform="${entry%%|*}"
            key="${entry#*|}"
            xcodebuild build \
              -scheme nestopia \
              -destination "generic/platform=${platform}" \
              -derivedDataPath ".build/binary-validation-${key}" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          done
          swift test
      - name: Bundle corresponding source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          scripts/package-source-archive.sh \
            "dist/nestopia-${TAG}-source.tar.gz" \
            "nestopia-${TAG}-source"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          CHECKSUM="$(cat dist/checksum.txt)"
          UPSTREAM="$(git -C nestopia rev-parse HEAD)"
          {
            echo "Prebuilt Nestopia CNestopiaCore for Nestopia."
            echo
            echo "Upstream commit: ${UPSTREAM}"
            echo "Slices: iOS, iOS Simulator, tvOS, tvOS Simulator, and macOS."
            echo
            echo "Package.swift checksum: ${CHECKSUM}"
          } > release-notes.md
          gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md \
            dist/CNestopiaCore.xcframework.zip dist/SOURCES.txt "dist/nestopia-${TAG}-source.tar.gz"
      - name: Bump Package.swift
        if: inputs.bump_manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          CHECKSUM="$(cat dist/checksum.txt)"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          /usr/bin/sed -i '' \
            -e "s|^let engineBinaryBaseURL = .*|let engineBinaryBaseURL = \"${BASE_URL}\"|" \
            -e "s|^let engineChecksum = .*|let engineChecksum = \"${CHECKSUM}\"|" \
            Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="engine-bump/${TAG}"
          git checkout -b "$BRANCH"
          git add Package.swift
          git commit -m "chore: point Package.swift at engine release ${TAG}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: point Package.swift at engine release ${TAG}" \
            --body "Merging publishes the draft ${TAG} release and matching Android AAR." \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH"
